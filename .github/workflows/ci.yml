name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  ci:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: ['24']

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: the private-reference check reads the commit messages
          # this branch adds, which a shallow clone does not contain.
          fetch-depth: 0

      # First, and before any build step: a leak is cheaper to catch than to
      # rewrite out of a public history.
      - name: Check for private references
        run: |
          git fetch --quiet origin "${{ github.event.repository.default_branch }}" || true
          BASE_REF="origin/${{ github.event.repository.default_branch }}" \
            scripts/check-no-private-refs.sh

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Typecheck
        run: yarn typecheck

      - name: Lint
        run: yarn lint

      - name: Format check
        run: yarn prettier:check

      - name: Run tests
        run: yarn test
