<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>paparats · code map</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="map-page">
    <div class="grain" aria-hidden="true"></div>

    <header class="masthead masthead--map">
      <div class="masthead__brand">
        <span class="brand__mark">▰▰</span>
        <a class="brand__name map-home" id="homeLink" href="./map">paparats</a>
        <span class="brand__sub">code map</span>
      </div>
      <div class="masthead__meta">
        <div class="meta__group">
          <label class="meta__label" for="groupSelect">group</label>
          <select id="groupSelect" class="map-select" aria-label="Group"></select>
        </div>
        <div class="meta__group map-search-box">
          <label class="meta__label" for="fileSearch">find a file</label>
          <input
            id="fileSearch"
            class="map-select map-search"
            type="search"
            placeholder="path or name"
            autocomplete="off"
            aria-controls="searchResults"
          />
          <ul id="searchResults" class="map-search__results" hidden></ul>
        </div>
        <div class="meta__group">
          <span class="meta__label">view</span>
          <a class="map-nav" href="./">console</a>
        </div>
      </div>
    </header>

    <nav class="map-crumbs" id="crumbs" aria-label="Where you are"></nav>

    <main class="map-main">
      <section id="banner" class="banner banner--hidden" role="status"></section>

      <section class="map-stage">
        <svg id="mapSvg" class="map-svg" aria-label="Code map">
          <defs>
            <marker
              id="arrow"
              viewBox="0 0 10 10"
              refX="10"
              refY="5"
              markerWidth="9"
              markerHeight="9"
              markerUnits="userSpaceOnUse"
              orient="auto-start-reverse"
            >
              <path d="M 0 0 L 10 5 L 0 10 z" class="map-arrow" />
            </marker>
            <marker
              id="arrowHot"
              viewBox="0 0 10 10"
              refX="10"
              refY="5"
              markerWidth="10"
              markerHeight="10"
              markerUnits="userSpaceOnUse"
              orient="auto-start-reverse"
            >
              <path d="M 0 0 L 10 5 L 0 10 z" class="map-arrow map-arrow--hot" />
            </marker>
          </defs>
          <g id="mapViewport">
            <g id="mapRing"></g>
            <g id="mapEdges"></g>
            <g id="mapNodes"></g>
          </g>
        </svg>
        <div class="map-zoom" role="group" aria-label="Zoom">
          <button type="button" id="zoomIn" title="Zoom in">+</button>
          <button type="button" id="zoomOut" title="Zoom out">−</button>
          <button type="button" id="zoomFit" title="Fit to screen">fit</button>
        </div>
        <div class="map-legend" id="legend"></div>
        <div class="map-empty" id="mapEmpty" hidden></div>
      </section>

      <aside class="map-panel" id="mapPanel" aria-live="polite">
        <span class="tile__eyebrow" id="panelEyebrow"></span>
        <h2 class="map-panel__title" id="panelTitle">Loading…</h2>
        <div id="panelBody" class="map-panel__body"></div>
      </aside>
    </main>

    <script src="./map.js"></script>
  </body>
</html>
